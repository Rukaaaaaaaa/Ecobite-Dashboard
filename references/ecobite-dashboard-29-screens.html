<title>EcoBite Bếp — Bộ màn</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Showcase: nền tối, các màn desktop xếp theo nhóm, mỗi màn có mã + tên + mô tả rồi tới mockup.
   Mockup dựng ở bề ngang thiết kế 1320px rồi thu nhỏ vừa cột, bấm vào mở xem đầy đủ. */
:root{
  --bg:#0B100D; --bg2:#121A15; --edge:#1E2B24; --edge2:#2A3A31;
  --txt:#E9F2EC; --txt2:#9AB0A4; --txt3:#6E8678; --acc:#5ECBA0;
  /* bảng màu bên trong mockup, luôn sáng */
  --s:#FFFFFF; --soft:#F4F9F5; --soft2:#EAF4EC; --ink:#1B2420; --ink2:#4B5A52; --ink3:#7C8A83;
  --ln:#E7EDE8; --ln2:#D8E3DB; --g9:#14532D; --g7:#1E8052; --g6:#2BA35F; --g1:#E3F3E8; --g05:#F1F9F3;
  --amb:#B06E00; --ambBg:#FDF3E0; --blu:#1C6FA8; --bluBg:#E8F1F8;
  --red:#C0392B; --redBg:#FBECEA; --gry:#6B7A72; --gryBg:#F0F3F1;
  --f:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- canvas ---------- */
.wrap{max-width:1760px;margin:0 auto;padding-block:26px 70px;padding-inline:22px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--edge)}
.top h1{font-size:27px;font-weight:700;color:#fff}
.top p{margin:5px 0 0;color:var(--txt2);font-size:13.5px;max-width:72ch}
.tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.05em;color:#F0C987;background:#2A2114;border:1px solid #42341C}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(11,16,13,.92);backdrop-filter:blur(10px);margin:0 -22px;padding:12px 22px;border-bottom:1px solid var(--edge);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gbtn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--edge2);background:transparent;color:var(--txt2);font-size:13px;font-weight:600}
.gbtn:hover{border-color:var(--acc);color:var(--txt)}
.gbtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#06130D}
.grp{margin-top:42px}
.grp>h2{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.grp>p{margin:0 0 20px;color:var(--txt3);font-size:13px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:38px 30px}
@media(max-width:620px){.shelf{grid-template-columns:1fr}}
.item{min-width:0}
.item .code{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--acc)}
.item h3{font-size:18.5px;font-weight:700;color:#fff;margin:5px 0 5px}
.item p{margin:0 0 13px;color:var(--txt2);font-size:13px;line-height:1.55;min-height:40px}
.shot{position:relative;border:1px solid var(--edge2);border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in;box-shadow:0 20px 50px -30px #000}
.shot:hover{border-color:var(--acc)}
.shot .sc{width:1320px;transform-origin:top left}
.shot .zoom{position:absolute;right:10px;bottom:10px;height:28px;padding:0 10px;border-radius:999px;background:rgba(11,16,13,.78);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;pointer-events:none}

/* ---------- focus ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(6,10,8,.94);display:flex;flex-direction:column}
.ovbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--edge)}
.ovbar b{font-size:15px;color:#fff}
.ovbar span{color:var(--txt2);font-size:13px}
.ovbody{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center}
.ovbody .sc{width:1320px;flex:0 0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--edge2);background:#fff;height:max-content}

/* ================= MOCKUP ================= */
.app{display:flex;min-height:760px;background:var(--soft);color:var(--ink);font-size:13.5px}
.app *{box-sizing:border-box}
.sd{width:226px;flex:0 0 auto;background:var(--s);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 13px}
.bd{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.bd img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.bd b{display:block;font-size:18px;font-weight:700;color:var(--g7);letter-spacing:-.02em;line-height:1.1}
.bd span{font-size:10.5px;color:var(--ink3)}
.sd nav{display:flex;flex-direction:column;gap:2px}
.sd nav a{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:13.5px;text-decoration:none}
.sd nav a[data-on]{background:var(--g1);color:var(--g9);font-weight:600}
.sd nav .bg{margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.sd .ft{margin-top:auto;padding:14px 8px 2px;color:var(--g7);font-size:12px;font-weight:500;line-height:1.6}
.mn{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.hb{flex:0 0 auto;background:var(--s);border-bottom:1px solid var(--ln);padding:12px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hb h1{font-size:19px;font-weight:700}
.hb .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.who{display:flex;align-items:center;gap:9px;margin-left:auto}
.who img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.ct{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cd{background:var(--s);border:1px solid var(--ln);border-radius:13px;box-shadow:0 1px 2px rgba(20,60,40,.05)}
.pd{padding:16px 18px}
.ttl{font-size:14.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.ttl .gro{flex:1}
.mu{color:var(--ink3);font-size:12px;line-height:1.55}
.bt{height:38px;padding:0 15px;border:0;border-radius:9px;background:var(--g7);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.bt.gh{background:var(--s);border:1px solid var(--ln2);color:var(--ink)}
.bt.sm{height:30px;padding:0 11px;font-size:12px;border-radius:7px}
.bt.dg{background:var(--s);border:1px solid var(--red);color:var(--red)}
.ip{width:100%;height:40px;border:1px solid var(--ln2);border-radius:9px;padding:0 12px;background:var(--s);min-width:0}
textarea.ip{height:auto;min-height:74px;padding:9px 12px;resize:none}
.lb{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.rq{color:var(--red)}
.bg2{display:inline-flex;align-items:center;height:23px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-size:10.5px;font-weight:600;color:var(--ink3);padding:0 7px 9px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tb td{padding:9px 7px;border-bottom:1px solid var(--ln);font-size:12.5px;white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.kp{padding:14px 15px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.kp .ic{width:31px;height:31px;border-radius:50%;background:var(--g1);color:var(--g7);display:grid;place-items:center;flex:0 0 auto}
.kp .v{font-size:21px;font-weight:700;letter-spacing:-.03em}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--ln);border-radius:9px;padding:3px;gap:2px}
.seg i{height:26px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink3);font-style:normal;display:flex;align-items:center}
.seg i[data-on]{background:var(--g7);color:#fff;font-weight:600}
.chp{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--ln2);background:var(--s);font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chp[data-on]{background:var(--g7);border-color:var(--g7);color:#fff}
.thb{border-radius:9px;object-fit:cover;flex:0 0 auto}
.stp{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.stp .n{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ln);color:var(--ink3);flex:0 0 auto}
.stp .n[data-on]{background:var(--g7);color:#fff}
.stp .l{flex:1;height:2px;background:var(--ln);min-width:18px}
.stp .l[data-on]{background:var(--g7)}
.note{padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.55}
.mt{height:6px;border-radius:999px;background:var(--ln);overflow:hidden}
.mt i{display:block;height:100%;border-radius:999px;background:var(--g6)}
.auth{display:flex;min-height:760px;background:var(--s);color:var(--ink)}
.auth .L{flex:0 0 42%;background:var(--g9);color:#DCEBE3;padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.auth .R{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;padding:36px 30px}
.auth .R>div{width:100%;max-width:392px}
.stl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
.stl li{display:flex;gap:11px;align-items:flex-start}
.stl .n{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;background:rgba(227,243,232,.16);color:#A3CBB5}
.stl li[data-on] .n{background:#E3F3E8;color:#14532D}
.stl b{display:block;font-size:13.5px;color:#EAF4EE;font-weight:600}
.stl span{font-size:12px;color:#93BCA6;line-height:1.5}
.otpb{width:100%;height:52px;border:1px solid var(--ln2);border-radius:10px;background:var(--s);text-align:center;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center}
.otpb[data-on]{border-color:var(--g6);box-shadow:0 0 0 3px rgba(43,163,95,.16)}
</style>

function bars(w,h,data,max,lab,hi){
 const PL=36,PR=8,PT=10,PB=22,iw=w-PL-PR,ih=h-PT-PB,st=iw/data.length,bw=st*.56;
 let g='',b='',t='';
 for(let i=0;i<=4;i++){const v=max/4*i,y=PT+ih-(v/max)*ih;
  g+=`<line x1="${PL}" x2="${w-PR}" y1="${y}" y2="${y}" stroke="var(--ln)"/>`;
  g+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${i?Math.round(v)+'tr':'0'}</text>`;}
 data.forEach((v,i)=>{const bh=Math.max(2,(v/max)*ih),x=PL+st*i+(st-bw)/2,y=PT+ih-bh;
  b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--g6)" opacity="${hi&&v>=hi?1:.7}"/>`;});
 lab.forEach(p=>{t+=`<text x="${(PL+st*p[0]+st/2).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10" fill="var(--ink3)">${p[1]}</text>`;});
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Biểu đồ cột">${g}${b}${t}</svg>`;}

function line(w,h,data,max){
 const PL=36,PR=8,PT=10,PB=22,iw=w-PL-PR,ih=h-PT-PB;
 const pt=data.map((v,i)=>[PL+i/(data.length-1)*iw,PT+ih-(v/max)*ih]);
 const d=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 let g='';for(let i=0;i<=4;i++){const y=PT+ih-(ih/4)*i;
  g+=`<line x1="${PL}" x2="${w-PR}" y1="${y}" y2="${y}" stroke="var(--ln)"/>`;
  g+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${Math.round(max/4*i)}tr</text>`;}
 const days=['T2','T3','T4','T5','T6','T7','CN'];
 let t='';pt.forEach((p,i)=>{t+=`<text x="${p[0].toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10" fill="var(--ink3)">${days[i]}</text>`;});
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Doanh thu bảy ngày">${g}
  <path d="${d} L ${pt[pt.length-1][0].toFixed(1)} ${PT+ih} L ${PL} ${PT+ih} Z" fill="var(--g6)" opacity=".12"/>
  <path d="${d}" fill="none" stroke="var(--g6)" stroke-width="2.2" stroke-linejoin="round"/>
  ${pt.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--g6)"/>`).join('')}${t}</svg>`;}

function donut(d,total,unit){
 let a=-Math.PI/2,arcs='';const R=50,r=35,cx=58,cy=58;
 d.forEach(x=>{const sw=x[1]/100*Math.PI*2,gp=.045,s=a+gp/2,e=a+sw-gp/2,bf=sw>Math.PI?1:0;
  const P=(rad,an)=>[(cx+rad*Math.cos(an)).toFixed(2),(cy+rad*Math.sin(an)).toFixed(2)];
  const p1=P(R,s),p2=P(R,e),p3=P(r,e),p4=P(r,s);
  arcs+=`<path d="M${p1[0]} ${p1[1]} A${R} ${R} 0 ${bf} 1 ${p2[0]} ${p2[1]} L${p3[0]} ${p3[1]} A${r} ${r} 0 ${bf} 0 ${p4[0]} ${p4[1]} Z" fill="${x[2]}"/>`;a+=sw;});
 return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <svg viewBox="0 0 116 116" width="110" height="110" style="flex:0 0 auto" role="img" aria-label="Tỷ lệ trạng thái">${arcs}
   <text x="58" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)">${total}</text>
   <text x="58" y="71" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${unit}</text></svg>
  <div style="flex:1 1 130px;min-width:0;display:flex;flex-direction:column;gap:7px">
   ${d.map(x=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="width:9px;height:9px;border-radius:50%;background:${x[2]};flex:0 0 auto"></span><span style="flex:1;min-width:0;color:var(--ink2)">${x[0]}</span><b class="num">${x[1]}%</b></div>`).join('')}</div></div>`;}

  if(filter!=='all'&&+filter!==gi+1)return '';
  return `<section class="grp"><h2>${esc(g[0])}</h2><p>${esc(g[1])}</p>
   <div class="shelf">${g[2].map(s=>`
    <article class="item">
     <div class="code">MÀN ${s[0]}</div><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p>
     <div class="shot" data-open="${s[0]}" role="button" tabindex="0" aria-label="Mở màn ${s[0]} ${esc(s[1])}">
      <div class="sc">${SC[s[0]]()}</div><span class="zoom">Bấm để xem đầy đủ</span></div>
    </article>`).join('')}</div></section>`;}).join('');
 root.innerHTML=`<div class="wrap">
  <header class="top">
   <div style="flex:1 1 420px;min-width:0"><h1>EcoBite Restaurant Dashboard</h1>
    <p>Bộ ${COUNT} màn thiết kế giao diện quản lý nhà hàng. Dạng web dashboard, bề ngang thiết kế 1320px. Toàn bộ số liệu là dữ liệu mẫu.</p></div>
   <span class="tag">BẢN THIẾT KẾ · DỮ LIỆU MẪU</span></header>
  <div class="bar">
   <button class="gbtn" data-f="all" aria-pressed="${filter==='all'}">Tất cả ${COUNT} màn</button>
   ${GROUPS.map((g,i)=>`<button class="gbtn" data-f="${i+1}" aria-pressed="${filter===String(i+1)}">Nhóm ${i+1} · ${g[2].length} màn</button>`).join('')}
  </div>
  ${shelves}</div>`;
 fit();
}
function fit(){
 document.querySelectorAll('.shot').forEach(sh=>{
  const sc=sh.querySelector('.sc');
  const k=sh.clientWidth/1320;
  sc.style.transform='scale('+k+')';
  sh.style.height=Math.round(sc.scrollHeight*k)+'px';});
}
function openOne(code){
 let it;
 GROUPS.forEach(x=>x[2].forEach(y=>{if(y[0]===code)it=y;}));
 const ov=document.createElement('div');
 ov.className='ov';
 ov.innerHTML=`<div class="ovbar"><b>MÀN ${code} · ${esc(it[1])}</b><span>${esc(it[2])}</span>
   <button class="gbtn" style="margin-left:auto" data-close>Đóng</button></div>
  <div class="ovbody"><div class="sc">${SC[code]()}</div></div>`;
 document.body.appendChild(ov);
 ov.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===ov)ov.remove();});
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',k);}});
}
document.addEventListener('click',e=>{
 const f=e.target.closest('[data-f]'); if(f){filter=f.dataset.f;build();window.scrollTo(0,0);return;}
 const s=e.target.closest('[data-open]'); if(s){openOne(s.dataset.open);return;}
});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('shot')){e.preventDefault();openOne(e.target.dataset.open);}
});
window.addEventListener('resize',fit);
build();
})();
</script>
